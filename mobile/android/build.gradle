buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        minSdkVersion = 24
        compileSdkVersion = 34
        targetSdkVersion = 34
        ndkVersion = "26.1.10909125"
        kotlinVersion = "1.9.22"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

// No vendor Maven repository and no download token. MapLibre publishes to Maven
// Central, which is the whole point of choosing it over Mapbox: nothing here
// requires an account, a secret, or a billing relationship to build.

apply plugin: "com.facebook.react.rootproject"
