org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
android.useAndroidX=true
android.enableJetifier=false

# x86_64 is included so the app runs on an emulator; release splits in
# app/build.gradle ship only the two ARM targets real phones use.
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86_64

# RN 0.74 old architecture. MapLibre RN v11 is new-architecture-only, which is
# why this project pins v10.
newArchEnabled=false

# Hermes: smaller bundle and faster cold start than JSC, which matters most on
# the low-end devices this app targets.
hermesEnabled=true

# NO SECRETS IN THIS FILE. Signing credentials belong in ~/.gradle/gradle.properties
# or the CI secret store, never in a committed file.
